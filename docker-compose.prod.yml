# ============================================================
# Docker Compose untuk SERVER (production)
#
# - Image DI-PULL dari GitHub Container Registry (ghcr.io) — server
#   tidak build apa pun (cepat & ringan, tidak butuh Go/Node di server).
# - Image otomatis di-build & di-push oleh GitHub Actions setiap kali
#   ada push ke branch main (lihat .github/workflows/docker-publish.yml).
# - Database TIDAK di dalam Docker — backend terhubung ke PostgreSQL
#   yang sudah jalan di server/VM.
# - Jangan pakai file ini untuk lokal; lokal tetap pakai docker-compose.yml.
#
# Cara pakai (di server):
#   cp .env.example .env
#   nano .env                  # isi DB_PASSWORD, JWT_SECRET, FRONTEND_URL
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Update ke versi terbaru (tunggu GitHub Actions selesai build dulu):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Mau pin ke versi tertentu (rollback)? Ganti :latest dengan hash commit,
# contoh: ghcr.io/pudyn/dough-room-co-backend:9dc23a2
# ============================================================
services:
  backend:
    image: ghcr.io/pudyn/dough-room-co-backend:latest
    pull_policy: always
    container_name: test-api
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-dough}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      DB_NAME: ${DB_NAME:-dough}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env (acak, min 32 karakter)}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-336h}
      SERVER_PORT: 8080
      TIMEZONE: ${TIMEZONE:-Asia/Jakarta}
      FRONTEND_URL: ${FRONTEND_URL:-https://doughroomco.my.id}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  frontend:
    image: ghcr.io/pudyn/dough-room-co-frontend:latest
    pull_policy: always
    container_name: test-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        # Frontend menunggu backend benar-benar SEHAT (bukan sekadar start)
        condition: service_healthy

volumes:
  uploads: