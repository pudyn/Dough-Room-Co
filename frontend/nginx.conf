events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 10M;

        # DNS internal Docker. Dengan resolver + variabel di proxy_pass,
        # "backend" di-resolve SAAT REQUEST (bukan saat nginx start) —
        # jadi nginx tidak mati walaupun backend belum siap / sedang restart.
        resolver 127.0.0.11 valid=10s ipv6=off;

        location /uploads/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /webhooks/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Static downloads (printer agent exe)
        location = /printer-agent.exe {
            root /app/public;
            default_type application/octet-stream;
            add_header Content-Disposition 'attachment; filename="printer-agent.exe"';
            add_header Cache-Control "no-cache";
        }

        location / {
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            add_header ngrok-skip-browser-warning "true" always;
        }
    }
}
